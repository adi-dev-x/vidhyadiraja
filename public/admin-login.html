<!DOCTYPE html>
<html lang="en" class="no-js">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login | Sree Vidyadhiraja Foundation</title>
  <meta name="theme-color" content="#061f33">
  <link rel="icon" type="image/png" href="img/logov.png">
  <meta name="robots" content="noindex">
  <script>document.documentElement.classList.replace('no-js','js');setTimeout(function(){if(!window.__motion)document.documentElement.classList.remove('js')},2500);</script>

  <!-- Fonts: Fraunces (display) + Plus Jakarta Sans (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">

  <!-- Framework & icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">

  <!-- Design system -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main class="login-page">
    <aside class="login-aside">
      <div class="hero-grid" aria-hidden="true"></div>
      <a href="index.html" class="brand">
        <img src="img/opt/logo-160.png" alt="" width="44" height="44">
        <span class="brand-name">Sree Vidyadhiraja Foundation<small>Admin Console</small></span>
      </a>
      <div>
        <span class="eyebrow" style="color:var(--saffron-300)">Content management</span>
        <h2>Manage blogs, videos, banners &amp; campaigns.</h2>
        <p class="mb-0" style="max-width: 420px">Sign in with your administrator account to update what visitors see across the site.</p>
      </div>
      <p class="small mb-0">&copy; Sree Vidyadhiraja Foundation</p>
    </aside>

    <section class="login-main">
      <div class="login-card">
        <span class="icon-tile mb-4"><i class="fa fa-lock" aria-hidden="true"></i></span>
        <h2>Admin Login</h2>
        <p class="text-muted mb-4">Welcome back. Enter your credentials to continue.</p>
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <div class="input-icon">
              <i class="fa fa-envelope" aria-hidden="true"></i>
              <input type="email" id="email" class="form-control" placeholder="Enter email" required>
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label" for="password">Password</label>
            <div class="input-icon">
              <i class="fa fa-key" aria-hidden="true"></i>
              <input type="password" id="password" class="form-control" placeholder="Enter password" required>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-lg">Login <i class="fa fa-arrow-right" aria-hidden="true"></i></button>
          <p id="errorMsg" class="text-danger mt-3 mb-0 small" role="alert"></p>
        </form>
      </div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

    // ✅ Your Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyCxzn7eUe9QRa0sjLp4v6rS2RJU_cRCtkg",
      authDomain: "vidyadhiraja-b6ec5.firebaseapp.com",
      projectId: "vidyadhiraja-b6ec5",
      storageBucket: "vidyadhiraja-b6ec5.firebasestorage.app",
      messagingSenderId: "1018541742665",
      appId: "1:1018541742665:web:4ded9d4c51d33edd203d98"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Handle Login
    const loginForm = document.getElementById("loginForm");
    const errorMsg = document.getElementById("errorMsg");

    loginForm.addEventListener("submit", (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          // ✅ Login success → go to dashboard
          window.location.href = "admin-dashboard.html";
        })
        .catch((error) => {
          errorMsg.textContent = error.message;
        });
    });
  </script>
</body>

</html>
